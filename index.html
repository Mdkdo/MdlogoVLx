<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logo VL Advanced</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-light">
    <div id="app" class="mode-editor">
        <!-- Editor View -->
        <div id="editor-view" class="view">
            <header class="main-header">
                <h1>Logo VL Advanced</h1>
                <div class="header-actions">
                    <select id="themeSelect">
                        <option value="theme-light">Clair</option>
                        <option value="theme-dark">Sombre</option>
                        <option value="theme-monokai">Monokai</option>
                        <option value="theme-solarized">Solarized</option>
                        <option value="theme-midnight">Midnight</option>
                    </select>
                    <button id="runBtnTop" class="primary"><span class="icon" aria-hidden="true">▶</span> Exécuter</button>
                    <button id="settingsBtn" title="Paramètres"><span class="icon" aria-hidden="true">⚙</span></button>
                    <a href="https://clubannour.blogspot.com/p/mdlogovlhelp.html" target="_blank" class="help-link"><span class="icon" aria-hidden="true">?</span> Aide</a>
                </div>
            </header>

            <div id="settings-modal" class="modal hidden">
                <div class="modal-content">
                    <div class="modal-header">
                        <h2>Paramètres</h2>
                        <button class="close-modal">&times;</button>
                    </div>
                    <div class="modal-body">
                        <div class="setting-item">
                            <label for="bg-color-picker">Couleur du Canevas :</label>
                            <input type="color" id="bg-color-picker" value="#ffffff">
                        </div>
                        <div class="setting-item">
                            <label for="turtle-img-select">Image de la Tortue :</label>
                            <select id="turtle-img-select">
                                <option value="default">Classique (Triangle)</option>
                                <option value="turtle">Tortue dessinée</option>
                                <option value="spaceship">Vaisseau spatial</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="editor-workspace">
                <div class="toolbar-container">
<div class="toolbar">
    <!-- Fichiers -->
    <button id="newFileBtn" title="Nouveau">
        <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                <polyline points="14,2 14,8 20,8"/>
                <line x1="12" y1="18" x2="12" y2="12"/>
                <line x1="9" y1="15" x2="15" y2="15"/>
            </svg>
        </span>
    </button>
    
    <button id="openFileBtn" title="Ouvrir">
        <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                <path d="M12 11v6M9 14l3-3 3 3"/>
            </svg>
        </span>
    </button>
    
    <button id="saveFileBtn" title="Enregistrer">
        <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
                <polyline points="17,21 17,13 7,13 7,21"/>
                <polyline points="7,3 7,8 15,8"/>
            </svg>
        </span>
    </button>
    
    <span class="separator"></span>
    
    <!-- Édition -->
    <button id="undoBtn" title="Annuler">
        <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 7v6h6"/>
                <path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/>
            </svg>
        </span>
    </button>
    
    <button id="redoBtn" title="Rétablir">
        <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 7v6h-6"/>
                <path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3L21 13"/>
            </svg>
        </span>
    </button>
    
    <span class="separator"></span>
    
    <!-- Presse-papiers -->
    <button id="selectAllBtn" title="Tout sélectionner">
        <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="18" height="18" rx="2"/>
                <rect x="7" y="7" width="10" height="10" rx="1" fill="currentColor" opacity="0.2"/>
            </svg>
        </span>
    </button>
    
    <button id="copyBtn" title="Copier">
        <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="9" y="9" width="13" height="13" rx="2"/>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
            </svg>
        </span>
    </button>
    
    <button id="cutBtn" title="Couper">
        <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="6" cy="6" r="3"/>
                <circle cx="6" cy="18" r="3"/>
                <line x1="20" y1="4" x2="8.12" y2="15.88"/>
                <line x1="14.47" y1="14.48" x2="20" y2="20"/>
                <line x1="8.12" y1="8.12" x2="12" y2="12"/>
            </svg>
        </span>
    </button>
    
    <button id="pasteBtn" title="Coller">
        <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
                <rect x="8" y="2" width="8" height="4" rx="1"/>
                <path d="M9 12h6M9 16h6"/>
            </svg>
        </span>
    </button>
    
    <span class="separator"></span>
    
    <!-- Code -->
    <button id="commentBtn" title="Commenter">
        <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                <path d="M9 10h6M9 14h4"/>
            </svg>
        </span>
    </button>
    
    <button id="indentBtn" title="Indenter">
        <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="3 8 7 12 3 16"/>
                <line x1="11" y1="6" x2="21" y2="6"/>
                <line x1="11" y1="12" x2="21" y2="12"/>
                <line x1="11" y1="18" x2="21" y2="18"/>
            </svg>
        </span>
    </button>
    
    <button id="unindentBtn" title="Désindenter">
        <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="7 8 3 12 7 16"/>
                <line x1="11" y1="6" x2="21" y2="6"/>
                <line x1="11" y1="12" x2="21" y2="12"/>
                <line x1="11" y1="18" x2="21" y2="18"/>
            </svg>
        </span>
    </button>
</div>
                </div>
                
                <div class="examples-bar">
                    <label for="exampleSelect">Exemples</label>
                    <select id="exampleSelect">
                        <option value="">Choisir un exemple...</option>
                    </select>
                    <button id="loadExampleBtn" title="Charger l'exemple"><span class="icon" aria-hidden="true">▣</span> Charger</button>
                </div>

                <div id="editor-container">
                    <div id="line-numbers"></div>
                    <textarea id="codeEditor" spellcheck="false">REPETE 36 [
  REPETE 4 [
    AV 100
    TD 90
  ]
  TD 10
]</textarea>
                    <pre id="highlighting" aria-hidden="true"><code id="highlighting-content"></code></pre>
                </div>
            </div>
        </div>

        <!-- Execution View -->
        <div id="execution-view" class="view">
            <div class="exec-toolbar">
                <div class="toolbar-row">
                    <button id="backToEditorBtn" class="exec-btn"><span class="icon" aria-hidden="true">✎</span> Editeur</button>
                    <button id="stopBtn" class="exec-btn danger"><span class="icon" aria-hidden="true">■</span> Arrêter</button>
                    
                    <div class="status-bar">
                        <div class="status-item" title="Position de la Souris">
                            <span class="icon" aria-hidden="true">⌖</span> <span id="mouse-pos">0, 0</span>
                        </div>
                        <div class="status-item" title="Position de la Tortue">
                            <span class="icon" aria-hidden="true">⌾</span> <span id="turtle-pos">0, 0</span>
                        </div>
                        <div class="status-item" title="Angle de la Tortue">
                            <span class="icon" aria-hidden="true">↥</span> <span id="turtle-angle">0°</span>
                        </div>
                        <div class="status-item" title="Épaisseur du trait">
                            <span class="icon" aria-hidden="true">✎</span> <span id="pen-size">1</span>
                        </div>
                        <div class="status-item" title="Couleur du trait">
                            <span class="color-preview" id="pen-color-preview"></span> <span id="pen-color">#000000</span>
                        </div>
                        <div class="status-item" title="Couleur de remplissage">
                            <span class="color-preview" id="fill-color-preview"></span> <span id="fill-color-status">#000000</span>
                        </div>
                        <div class="status-item" title="Couleur du fond">
                            <span class="color-preview" id="bg-color-preview-status"></span> <span id="bg-color-status">#ffffff</span>
                        </div>
                    </div>
                </div>
                <div class="toolbar-row">
                    <div class="inline-cmd-container">
                        <input type="text" id="inlineCmdInput" placeholder="Saisir une commande Logo...">
                        <button id="runInlineBtn"><span class="icon" aria-hidden="true">▶</span></button>
                    </div>
                </div>
            </div>
            
            <div class="canvas-container">
                <div id="canvas-stage" class="canvas-stage">
                    <canvas id="turtleCanvas" width="800" height="600"></canvas>
                    <canvas id="turtleLayer" width="800" height="600"></canvas>
                </div>
            </div>

            <div id="terminal-section" class="terminal-popup hidden">
                <div class="terminal-header">
                    <span>Terminal</span>
                    <div class="terminal-actions">
                        <button id="clearTerminalBtn" title="Effacer"><span class="icon" aria-hidden="true">×</span></button>
                        <button id="toggleTerminalBtn" title="Masquer"><span class="icon" aria-hidden="true">⌄</span></button>
                    </div>
                </div>
                <div id="terminalOutput"></div>
            </div>
            
            <button id="showTerminalBtn"><span class="icon" aria-hidden="true">&gt;_</span> Terminal</button>
        </div>
    </div>

    
    <script src="src/turtle.js"></script>
    <script src="src/commands.js"></script>
    <script src="src/transpiler.js"></script>
    <script src="src/terminal.js"></script>
    <script src="src/runtime.js"></script>
    <script src="src/settings.js"></script>
    <script src="src/editor-highlighting.js"></script>
    <script src="src/editor-ui.js"></script>
    <script src="src/main.js"></script>
</body>
</html>
